openapi: 3.0.3
info:
  title: B2B Order API
  version: 1.0.0
  description: >
    API оформления и управления заказами оптовой платформы.
    Учебный контракт для портфолио.
servers:
  - url: https://api.example.com/api/v1
security:
  - bearerAuth: []
tags:
  - name: Orders
paths:
  /orders:
    post:
      tags: [Orders]
      summary: Создать заказ
      description: >
        Проверяет договор и кредитный лимит, рассчитывает цены по прайс-листу
        договора и резервирует остатки. Повторная отправка с тем же
        Idempotency-Key возвращает результат первого запроса.
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              contractId: CTR-1042
              deliveryAddressId: ADDR-77
              items:
                - { sku: SKU-1001, quantity: 120 }
                - { sku: SKU-2040, quantity: 30 }
              comment: Доставка до 12:00
      responses:
        '201':
          description: Заказ создан
          headers:
            Location:
              schema: { type: string }
              description: URL созданного заказа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Конфликт идемпотентности (ключ уже использован с другим телом запроса)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Нарушено бизнес-правило (лимит, остатки, договор)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                creditLimit:
                  value:
                    code: CREDIT_LIMIT_EXCEEDED
                    message: Сумма заказа превышает доступный кредитный лимит
                    details: { available: 100000.00, required: 184500.00 }
                    traceId: a1b2c3d4
        '429':
          description: Превышен лимит запросов
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Зависимый сервис временно недоступен, запрос можно повторить
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Orders]
      summary: Список заказов организации
      operationId: listOrders
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: createdFrom
          in: query
          schema: { type: string, format: date }
        - name: createdTo
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Страница заказов
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  nextCursor:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Получить заказ
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Отменить заказ
      description: Допустимо из статусов NEW, AWAITING_APPROVAL, CONFIRMED. Снимает резерв.
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Заказ отменён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Недопустимый переход статуса
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID, уникальный для одной логической операции. Хранится 24 часа.
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, example: ORD-558201 }
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Не аутентифицирован
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Нет прав или ресурс принадлежит другой организации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    OrderStatus:
      type: string
      enum: [NEW, AWAITING_APPROVAL, CONFIRMED, REJECTED, PARTIALLY_SHIPPED, SHIPPED, DELIVERED, CANCELLED]
    Money:
      type: object
      required: [value, currency]
      properties:
        value: { type: number, format: double, example: 184500.00 }
        currency: { type: string, example: RUB, minLength: 3, maxLength: 3 }
    CreateOrderRequest:
      type: object
      required: [contractId, deliveryAddressId, items]
      properties:
        contractId: { type: string, maxLength: 32 }
        deliveryAddressId: { type: string, maxLength: 32 }
        comment: { type: string, maxLength: 500 }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: { type: string, maxLength: 32 }
              quantity: { type: integer, minimum: 1, maximum: 100000 }
    Order:
      type: object
      required: [orderId, status, totalAmount, createdAt]
      properties:
        orderId: { type: string, example: ORD-558201 }
        contractId: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string, example: CREDIT_LIMIT_EXCEEDED }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        traceId: { type: string }
